const addMonthsToDate = (iso, n) => {
  const [y, m, d] = iso.split('-').map(Number);
  let mm = m - 1 + n, yy = y;
  yy += Math.floor(mm / 12); mm = ((mm % 12) + 12) % 12;
  const lastDay = new Date(yy, mm + 1, 0).getDate();
  return `${yy}-${String(mm + 1).padStart(2, '0')}-${String(Math.min(d, lastDay)).padStart(2, '0')}`;

// ============================================================
// Armazenamento local (sempre ativo — funciona offline)

const LOCAL_PREFIX = 'pfc:';
const LocalStore = {
  get(key) { try { const v = localStorage.getItem(LOCAL_PREFIX + key); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(key, val) { try { localStorage.setItem(LOCAL_PREFIX + key, JSON.stringify(val)); return true; } catch (e) { return false; } },

// ============================================================
// Sincronização em tempo real com Firestore (Firebase / Google Cloud)
// Cada casal usa seu próprio projeto Firebase (gratuito) e um
// código da casa identifica o documento; a autorização vem do Firebase Auth.
// ============================================================
const FIRESTORE_COLLECTION = 'paineis';

// Aceita tanto JSON válido quanto o objeto colado direto do console do
// Firebase (chaves sem aspas, aspas simples etc.) e normaliza para JSON.
function parseFirebaseConfigInput(raw) {
  if (!raw || !raw.trim()) throw new Error('Cole a configuração do Firebase.');
  let txt = raw.trim();
  const braceStart = txt.indexOf('{');
  const braceEnd = txt.lastIndexOf('}');
  if (braceStart >= 0 && braceEnd > braceStart) txt = txt.slice(braceStart, braceEnd + 1);
  try { return JSON.parse(txt); } catch (e) {}
  try {
    const normalized = txt
      .replace(/'/g, '"')
      .replace(/,\s*}/g, '}')
      .replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g, '$1"$2":');
    return JSON.parse(normalized);
  } catch (e) {
    throw new Error('Não entendi essa configuração. Copie o objeto "firebaseConfig" inteiro do console do Firebase e cole aqui.');
  }
}

function sanitizeCode(code) {
  return String(code || '').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-').slice(0, 60);
}

function getFirebaseApp(cfg) {
  const existing = firebase.apps.length ? firebase.app() : null;
  if (existing && existing.options.projectId !== cfg.projectId) {
    firebase.apps.forEach((app) => app.delete && app.delete());
    return firebase.initializeApp(cfg);
  }
  return existing || firebase.initializeApp(cfg);
}

function useFirestoreSync(onRemoteData) {
  const [config, setConfigRaw] = useState(() => LocalStore.get('fb_config') || null);
  const [code, setCodeRaw] = useState(() => LocalStore.get('fb_code') || '');
  const [connected, setConnected] = useState(false);
  const [status, setStatus] = useState('idle'); // idle | connecting | ready | error
  const [errorMsg, setErrorMsg] = useState('');
  const [lastSync, setLastSync] = useState(null);
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [authError, setAuthError] = useState('');
  const dbRef = useRef(null);
  const docRef = useRef(null);
  const authRef = useRef(null);
  const unsubRef = useRef(null);
  const onRemoteDataRef = useRef(onRemoteData);
  onRemoteDataRef.current = onRemoteData;

  const setConfig = useCallback((cfg) => { setConfigRaw(cfg); LocalStore.set('fb_config', cfg); }, []);
  const setCode = useCallback((c) => { const clean = sanitizeCode(c); setCodeRaw(clean); LocalStore.set('fb_code', clean); }, []);

  const teardown = useCallback(() => {
    if (unsubRef.current) { unsubRef.current(); unsubRef.current = null; }
    setConnected(false);
  }, []);

  const connect = useCallback(async (cfgArg, codeArg) => {
    const cfg = cfgArg || config;
    const cod = sanitizeCode(codeArg || code);
    if (!cfg) throw new Error('Cole a configuração do Firebase antes de conectar.');
    if (!cod) throw new Error('Defina um identificador da casa/casal antes de conectar.');
    setStatus('connecting'); setErrorMsg('');
    try {
      teardown();
      const app = getFirebaseApp(cfg);
      const auth = firebase.auth(app);
      authRef.current = auth;
      if (!auth.currentUser) throw new Error('Faça login com e-mail e senha antes de conectar.');
      setUser(auth.currentUser);
      setAuthReady(true);
      const db = firebase.firestore(app);
      try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
      dbRef.current = db;
      const houseRef = db.collection(FIRESTORE_COLLECTION).doc(cod);
      const houseSnapshot = await houseRef.get();
      if (!houseSnapshot.exists) {
        await houseRef.set({ ownerUid: auth.currentUser.uid, members: [auth.currentUser.uid] });
      }
      docRef.current = houseRef;
      unsubRef.current = houseRef.onSnapshot(
        (snap) => {
          setConnected(true); setStatus('ready'); setErrorMsg('');
          if (!snap.metadata.hasPendingWrites) setLastSync(new Date());
          const data = snap.data();
          if (data) onRemoteDataRef.current(data, snap.metadata.hasPendingWrites);
        },
        (err) => { setStatus('error'); setErrorMsg(err.message || String(err)); setConnected(false); }
      );
      setConfig(cfg); setCode(cod);
      return true;
    } catch (e) {
      setStatus('error'); setErrorMsg(e.message || String(e)); setConnected(false);
      throw e;
    }
  }, [config, code, teardown, setConfig, setCode]);

  const authenticate = useCallback(async (cfgArg, mode, email, password) => {
    const cfg = cfgArg || config;
    if (!cfg) throw new Error('Cole a configuração do Firebase antes de entrar.');
    setAuthError('');
    try {
      const app = getFirebaseApp(cfg);
      const auth = firebase.auth(app);
      authRef.current = auth;
      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      const credential = mode === 'signup'
        ? await auth.createUserWithEmailAndPassword(email.trim(), password)
        : await auth.signInWithEmailAndPassword(email.trim(), password);
      setUser(credential.user);
      setAuthReady(true);
      setConfig(cfg);
      return credential.user;
    } catch (e) {
      const messages = { 'auth/invalid-credential': 'E-mail ou senha inválidos.', 'auth/email-already-in-use': 'Este e-mail já está cadastrado.', 'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.', 'auth/invalid-email': 'Informe um e-mail válido.', 'auth/operation-not-allowed': 'O login por e-mail e senha está desativado. No Firebase Console, abra Authentication → Sign-in method, ative E-mail/senha e salve.' };
      const message = messages[e.code] || e.message || String(e);
      setAuthError(message);
      throw new Error(message);
    }
  }, [config, setConfig]);

  const logout = useCallback(async () => {
    if (authRef.current) await authRef.current.signOut();
    teardown(); setUser(null); setAuthReady(false); setStatus('idle');
  }, [teardown]);

  const disconnect = useCallback(() => { teardown(); setStatus('idle'); }, [teardown]);

  const pushKey = useCallback(async (key, value) => {
    if (!docRef.current) return;
    await docRef.current.set(
      { [key]: value, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: user ? user.uid : null },
      { merge: true }
    );
  }, [code, user]);

  const addMember = useCallback(async (memberUid) => {
    if (!docRef.current || !memberUid.trim()) throw new Error('Informe o UID do parceiro.');
    await docRef.current.set({ members: firebase.firestore.FieldValue.arrayUnion(memberUid.trim()) }, { merge: true });
  }, [code]);

  // Restaura a sessão local do Firebase sem salvar a senha no navegador.
  useEffect(() => {
    if (!config) { setAuthReady(true); return undefined; }
    let disposed = false;
    let unsubscribe = () => {};
    try {
      const app = getFirebaseApp(config);
      const auth = firebase.auth(app);
      authRef.current = auth;
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
      unsubscribe = auth.onAuthStateChanged((currentUser) => {
        if (disposed) return;
        setUser(currentUser || null);
        setAuthReady(true);
        if (currentUser && code) connect(config, code).catch(() => {});
      });
    } catch (e) {
      setAuthError('Não foi possível restaurar a sessão. Entre novamente.');
      setAuthReady(true);
    }
    return () => { disposed = true; unsubscribe(); teardown(); };
  }, [config, code, connect, teardown]);

  return { config, setConfig, code, setCode, connected, status, errorMsg, lastSync, connect, disconnect, pushKey, addMember, user, authReady, authError, authenticate, logout };
}

      {sub ? <span className="text-xs" style={{ color: C.inkMuted }}>{sub}</span> : null}
    </div>
  );
}
function FieldLabel({ children }) { return <label className="text-sm mb-1 block" style={{ color: C.inkMuted }}>{children}</label>; }
function TextInput(props) {
  return <input {...props} className={`w-full rounded-lg px-3 py-2 text-sm outline-none transition-colors ${props.className || ''}`}
    style={{ background: C.panelAlt, border: `1px solid ${C.border}`, color: C.ink, ...(props.style || {}) }} />;

function DonutChart({ data, size = 180, thickness = 26 }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  const r = (size - thickness) / 2;
  const cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  const gap = total > 0 ? circumference * 0.006 : 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.panelAlt} strokeWidth={thickness} />
      {data.map((d) => {
        const frac = total > 0 ? d.value / total : 0;
        const len = Math.max(0, frac * circumference - gap);
        const el = (
          <circle key={d.id} cx={cx} cy={cy} r={r} fill="none" stroke={d.color} strokeWidth={thickness}
            strokeDasharray={`${len} ${circumference - len}`} strokeDashoffset={-offset}
            transform={`rotate(-90 ${cx} ${cy})`} strokeLinecap="butt">
            <title>{`${d.name}: ${formatBRL(d.value)}`}</title>
          </circle>
        );
        offset += frac * circumference;
        return el;
      })}
    </svg>
  );
}

function TrendChart({ data, referenceValue, width = 560, height = 220 }) {
  const padL = 54, padR = 14, padT = 16, padB = 26;
  const innerW = width - padL - padR, innerH = height - padT - padB;
  const allVals = data.flatMap((d) => [d.gastos, d.poupanca]).concat(referenceValue ? [referenceValue] : []);
  const maxVal = Math.max(1, ...allVals) * 1.15;
  const x = (i) => padL + (data.length > 1 ? (i / (data.length - 1)) * innerW : innerW / 2);
  const y = (v) => padT + innerH - (v / maxVal) * innerH;
  const pathOf = (key) => data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${x(i)} ${y(d[key])}`).join(' ');
  const ticks = 4;
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="xMidYMid meet">
      {Array.from({ length: ticks + 1 }).map((_, i) => {
        const v = (maxVal / ticks) * i;
        const yy = y(v);
        return (
          <g key={i}>
            <line x1={padL} x2={width - padR} y1={yy} y2={yy} stroke={C.border} strokeDasharray="3 3" />
            <text x={padL - 8} y={yy + 3} fontSize="10" fill={C.inkMuted} textAnchor="end">{`R$${Math.round(v / 1000)}k`}</text>
          </g>
        );
      })}
      {referenceValue > 0 && (
        <g>
          <line x1={padL} x2={width - padR} y1={y(referenceValue)} y2={y(referenceValue)} stroke={C.gold} strokeDasharray="4 4" />
          <text x={width - padR} y={y(referenceValue) - 4} fontSize="10" fill={C.gold} textAnchor="end">Renda atual</text>
        </g>
      )}
      <path d={pathOf('gastos')} fill="none" stroke={C.alert} strokeWidth="2" />
      <path d={pathOf('poupanca')} fill="none" stroke={C.pine} strokeWidth="2" />
      {data.map((d, i) => (
        <g key={i}>
          <circle cx={x(i)} cy={y(d.gastos)} r="3" fill={C.alert}><title>{`${d.month} · Gastos: ${formatBRL(d.gastos)}`}</title></circle>
          <circle cx={x(i)} cy={y(d.poupanca)} r="3" fill={C.pine}><title>{`${d.month} · Poupança: ${formatBRL(d.poupanca)}`}</title></circle>
          <text x={x(i)} y={height - 6} fontSize="11" fill={C.inkMuted} textAnchor="middle">{d.month}</text>
        </g>
      ))}
    </svg>
  );
}

function FinanceDashboard() {
  const [income, setIncome] = useState(() => LocalStore.get('income') || defaultIncome);
  const [entries, setEntries] = useState(() => LocalStore.get('entries') || []);
  const [goals, setGoals] = useState(() => LocalStore.get('goals') || []);
  const [budgetRule, setBudgetRule] = useState(() => LocalStore.get('budgetRule') || defaultBudgetRule);
  const [cards, setCards] = useState(() => LocalStore.get('cards') || []);
  const [cashMovements, setCashMovements] = useState(() => LocalStore.get('cashMovements') || []);
  const [cashForm, setCashForm] = useState({ type: 'entrada', amount: '', description: '', date: todayISO() });
  const [cashError, setCashError] = useState('');
  const [activeTab, setActiveTab] = useState('dashboard');
  const [selectedMonth, setSelectedMonth] = useState(currentMonthKey());
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [toast, setToast] = useState('');
  const [resetArmed, setResetArmed] = useState(false);
  const [quickAddOpen, setQuickAddOpen] = useState(false);
  const [cardForm, setCardForm] = useState(emptyCardForm());
  const [cardError, setCardError] = useState('');
  const [editingCardId, setEditingCardId] = useState(null);

  const [entryForm, setEntryForm] = useState(emptyEntryForm());
  const [entryError, setEntryError] = useState('');
  const [goalForm, setGoalForm] = useState(emptyGoalForm());
  const [goalError, setGoalError] = useState('');
  const [contribDrafts, setContribDrafts] = useState({});
  const [historyFilter, setHistoryFilter] = useState({ person: 'todos', category: 'todas' });
  const [showAllMonths, setShowAllMonths] = useState(false);
  const [fbConfigText, setFbConfigText] = useState(() => { const c = LocalStore.get('fb_config'); return c ? JSON.stringify(c, null, 2) : ''; });
  const [fbCodeInput, setFbCodeInput] = useState(() => LocalStore.get('fb_code') || '');
  const [partnerUid, setPartnerUid] = useState('');

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2200); };

  // Quando chega um dado novo do Firestore (de qualquer aparelho conectado
  // ao mesmo "código da casa"), atualiza o estado local automaticamente —
  // não é preciso clicar em nada, a sincronização é em tempo real.
  const applyRemoteData = useCallback((data, isLocalEcho) => {
    if (data.income !== undefined) { setIncome(data.income); LocalStore.set('income', data.income); }
    if (data.entries !== undefined) { setEntries(data.entries); LocalStore.set('entries', data.entries); }
    if (data.goals !== undefined) { setGoals(data.goals); LocalStore.set('goals', data.goals); }
    if (data.budgetRule !== undefined) { setBudgetRule(data.budgetRule); LocalStore.set('budgetRule', data.budgetRule); }
    if (data.cards !== undefined) { setCards(data.cards); LocalStore.set('cards', data.cards); }
    if (data.cashMovements !== undefined) { setCashMovements(data.cashMovements); LocalStore.set('cashMovements', data.cashMovements); }
    if (!isLocalEcho) {
      showToast(data.updatedBy && syncUserId() !== data.updatedBy ? 'Seu parceiro lançou um gasto' : 'Dados atualizados');
      if (data.updatedBy && syncUserId() !== data.updatedBy && 'Notification' in window && Notification.permission === 'granted') new Notification('Novo lançamento', { body: 'Seu parceiro atualizou o painel financeiro.' });
    }
  }, []);

  const syncUserId = () => { try { return firebase.auth().currentUser && firebase.auth().currentUser.uid; } catch (e) { return null; } };

  const sync = useFirestoreSync(applyRemoteData);

  const requestNotifications = async () => {
    if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
    showToast(Notification.permission === 'granted' ? 'Notificações ativadas' : 'Notificações não autorizadas');
  };

  // ---- Persistência: sempre local; envia para o Firestore se conectado ----
  const persist = useCallback((key, value) => {
    LocalStore.set(key, value);
    if (sync.connected) {
      sync.pushKey(key, value).catch((e) => showToast('Não sincronizou com o banco de dados: ' + e.message));
    }
  }, [sync]);

  const handleConnectFirebase = async (cfgText, code) => {
    try {
      const cfg = parseFirebaseConfigInput(cfgText);
      await sync.connect(cfg, code);
      showToast('Conectado ao banco de dados');
      // envia o estado atual como primeira sincronização, caso o documento esteja vazio
      SYNC_KEYS.forEach((k) => {
        const val = { income, entries, goals, budgetRule, cards, cashMovements }[k];
        sync.pushKey(k, val).catch(() => {});
      });
    } catch (e) {
      showToast('Não foi possível conectar: ' + e.message);
    }
  };

  const handleAddMember = async () => {
    try { await sync.addMember(partnerUid); setPartnerUid(''); showToast('Parceiro autorizado nesta casa'); }
    catch (e) { showToast('Não foi possível autorizar: ' + e.message); }
  };

  // ---- Derivados ----
  const personNames = useMemo(() => ['Casal', income.p1.name || 'Pessoa 1', income.p2.name || 'Pessoa 2'], [income]);
  const monthEntries = useMemo(() => entries.filter((e) => monthKeyOf(e.date) === selectedMonth), [entries, selectedMonth]);
  const totalIncome = Number(income.p1.amount || 0) + Number(income.p2.amount || 0);
  const totalsByType = useMemo(() => {
    const t = { necessidade: 0, desejo: 0, poupanca: 0 };
    monthEntries.forEach((e) => { t[e.budgetType] = (t[e.budgetType] || 0) + Number(e.amount || 0); });
    return t;
  }, [monthEntries]);
  const totalOut = totalsByType.necessidade + totalsByType.desejo + totalsByType.poupanca;
  const balance = totalIncome - totalOut;
  const savingsRate = totalIncome > 0 ? (totalsByType.poupanca / totalIncome) * 100 : 0;
  const totalsByCategory = useMemo(() => {
    const map = {};
    monthEntries.forEach((e) => { map[e.category] = (map[e.category] || 0) + Number(e.amount || 0); });
    return CATEGORIES.map((c) => ({ id: c.id, name: c.label, value: map[c.id] || 0, color: c.color })).filter((c) => c.value > 0);
  }, [monthEntries]);
  const totalCategorySum = totalsByCategory.reduce((s, c) => s + c.value, 0);
  const totalsByPerson = useMemo(() => {
    const map = {};
    monthEntries.forEach((e) => { map[e.person] = (map[e.person] || 0) + Number(e.amount || 0); });
    return map;
  }, [monthEntries]);
  const trendData = useMemo(() => {
    const keys = last6MonthKeys(selectedMonth);
    return keys.map((k) => {
      const monEntries = entries.filter((e) => monthKeyOf(e.date) === k);
      const gastos = monEntries.filter((e) => e.budgetType !== 'poupanca').reduce((s, e) => s + Number(e.amount || 0), 0);
      const poupanca = monEntries.filter((e) => e.budgetType === 'poupanca').reduce((s, e) => s + Number(e.amount || 0), 0);
      return { month: monthLabel(k), gastos, poupanca };
    });
  }, [entries, selectedMonth]);

  // ---- Handlers: lançamentos ----
  const buildEntries = (form) => {
    const amount = parseFloat(form.amount);
    const isCredit = form.paymentMethod === 'credito';
    const n = isCredit ? Math.max(1, parseInt(form.installments, 10) || 1) : (form.recurrence === 'Mensal' ? 12 : 1);
    const groupId = n > 1 ? uid() : null;
    const perInstallment = Math.round((amount / n) * 100) / 100;
    const list = [];
    for (let i = 0; i < n; i++) {
      const isLast = i === n - 1;
      const parcelAmount = isLast ? Math.round((amount - perInstallment * (n - 1)) * 100) / 100 : perInstallment;
      list.push({
        id: uid(),
        date: addMonthsToDate(form.date, i),
        description: form.description,
        category: form.category,
        amount: parcelAmount,
        person: form.person,
        budgetType: form.budgetType,
        recurrence: form.recurrence,
        paymentMethod: form.paymentMethod,
        cardId: isCredit ? form.cardId : '',
        installments: n,
        installmentNumber: i + 1,
        groupId,
        petSubcategory: form.category === 'pet' ? (form.petSubcategory || '') : '',
      });
    }
    return list;
  };

  const handleAddEntry = () => {
    setEntryError('');
    const amount = parseFloat(entryForm.amount);
    if (!entryForm.date) return setEntryError('Escolha uma data.');
    if (!amount || amount <= 0) return setEntryError('Informe um valor maior que zero.');
    if (entryForm.paymentMethod === 'credito' && !entryForm.cardId) return setEntryError('Escolha o cartão usado.');
    const defaultDesc = entryForm.category === 'pet' && entryForm.petSubcategory ? `Pet · ${entryForm.petSubcategory}` : catById(entryForm.category).label;
    const form = { ...entryForm, description: entryForm.description.trim() || defaultDesc };
    const newEntries = buildEntries(form);
    const updated = [...entries, ...newEntries];
    setEntries(updated); persist('entries', updated);
    setEntryForm({ ...emptyEntryForm(), person: entryForm.person });
    showToast(newEntries.length > 1 ? `Lançamento salvo em ${newEntries.length}x` : 'Lançamento salvo');
    setQuickAddOpen(false);
  };
  const handleDeleteEntry = (id) => { const updated = entries.filter((e) => e.id !== id); setEntries(updated); persist('entries', updated); };

  // ---- Handlers: cartões de crédito ----
  const handleSaveCard = () => {
    setCardError('');
    if (!cardForm.name.trim()) return setCardError('Dê um nome ao cartão.');
    const closingDay = Number(cardForm.closingDay), dueDay = Number(cardForm.dueDay);
    if (!closingDay || closingDay < 1 || closingDay > 28) return setCardError('Dia de fechamento entre 1 e 28.');
    if (!dueDay || dueDay < 1 || dueDay > 28) return setCardError('Dia de vencimento entre 1 e 28.');
    const cleaned = { ...cardForm, limit: Number(cardForm.limit) || 0, closingDay, dueDay };
    let updated;
    if (editingCardId) updated = cards.map((c) => (c.id === editingCardId ? { ...cleaned, id: editingCardId } : c));
    else updated = [...cards, { ...cleaned, id: uid() }];
    setCards(updated); persist('cards', updated);
    setCardForm(emptyCardForm()); setEditingCardId(null);
    showToast('Cartão salvo');
  };
  const handleEditCard = (card) => { setCardForm({ name: card.name, limit: card.limit, closingDay: String(card.closingDay), dueDay: String(card.dueDay), color: card.color }); setEditingCardId(card.id); };
  const handleDeleteCard = (id) => {
    const updated = cards.filter((c) => c.id !== id);
    setCards(updated); persist('cards', updated);
    if (editingCardId === id) { setCardForm(emptyCardForm()); setEditingCardId(null); }
  };

  // ---- Faturas dos cartões no mês selecionado ----
  const cardInvoices = useMemo(() => {
    return cards.map((card) => {
      const spent = entries.filter((e) => e.cardId === card.id && monthKeyOf(e.date) === selectedMonth).reduce((s, e) => s + Number(e.amount || 0), 0);
      const today = new Date();
      let due = new Date(today.getFullYear(), today.getMonth(), card.dueDay);
      if (due < today) due = new Date(today.getFullYear(), today.getMonth() + 1, card.dueDay);
      const daysToDue = Math.ceil((due - today) / 86400000);
      return { ...card, spent, daysToDue };
    });
  }, [cards, entries, selectedMonth]);
  const totalCardInvoices = cardInvoices.reduce((s, c) => s + c.spent, 0);
  const nextDueCard = useMemo(() => cardInvoices.filter((c) => c.spent > 0).sort((a, b) => a.daysToDue - b.daysToDue)[0], [cardInvoices]);

  // ---- Gasto com pets no mês selecionado ----
  const petSpentThisMonth = useMemo(() =>
    entries.filter((e) => e.category === 'pet' && monthKeyOf(e.date) === selectedMonth).reduce((s, e) => s + Number(e.amount || 0), 0),
    [entries, selectedMonth]);

  // ---- Handlers: caixa do casal (dinheiro disponível) ----
  const cashBalance = useMemo(() => cashMovements.reduce((s, m) => s + (m.type === 'entrada' ? Number(m.amount) : -Number(m.amount)), 0), [cashMovements]);
  const handleAddCashMovement = () => {
    setCashError('');
    const amount = parseFloat(cashForm.amount);
    if (!amount || amount <= 0) return setCashError('Informe um valor maior que zero.');
    if (!cashForm.date) return setCashError('Escolha uma data.');
    if (cashForm.type === 'saida' && amount > cashBalance) return setCashError('Esse valor é maior do que o dinheiro disponível em caixa.');
    const movement = { id: uid(), type: cashForm.type, amount, description: cashForm.description.trim() || (cashForm.type === 'entrada' ? 'Entrada' : 'Retirada'), date: cashForm.date };
    const updated = [...cashMovements, movement];
    setCashMovements(updated); persist('cashMovements', updated);
    setCashForm({ type: cashForm.type, amount: '', description: '', date: todayISO() });
    showToast(cashForm.type === 'entrada' ? 'Dinheiro adicionado ao caixa' : 'Retirada registrada');
  };
  const handleDeleteCashMovement = (id) => { const updated = cashMovements.filter((m) => m.id !== id); setCashMovements(updated); persist('cashMovements', updated); };

  // ---- Handlers: renda e regra ----
  const handleSaveIncome = () => {
    const cleaned = { p1: { name: income.p1.name || 'Pessoa 1', amount: Number(income.p1.amount) || 0 }, p2: { name: income.p2.name || 'Pessoa 2', amount: Number(income.p2.amount) || 0 } };
    setIncome(cleaned); persist('income', cleaned); showToast('Renda atualizada');
  };
  const handleSaveBudgetRule = () => {
    const sum = Number(budgetRule.necessidade) + Number(budgetRule.desejo) + Number(budgetRule.poupanca);
    if (sum !== 100) { showToast('As porcentagens devem somar 100%'); return; }
    persist('budgetRule', budgetRule); showToast('Meta de orçamento salva');
  };

  // ---- Handlers: metas ----
  const handleAddGoal = () => {
    setGoalError('');
    const target = parseFloat(goalForm.target);
    if (!goalForm.name.trim()) return setGoalError('Dê um nome à meta.');
    if (!target || target <= 0) return setGoalError('Informe um valor alvo maior que zero.');
    const current = parseFloat(goalForm.current) || 0;
    const newGoal = { id: uid(), ...goalForm, target, current };
    const updated = [...goals, newGoal];
    setGoals(updated); persist('goals', updated);
    setGoalForm(emptyGoalForm()); showToast('Meta criada');
  };
  const handleDeleteGoal = (id) => { const updated = goals.filter((g) => g.id !== id); setGoals(updated); persist('goals', updated); };
  const handleContribute = (id) => {
    const raw = contribDrafts[id]; const amount = parseFloat(raw);
    if (!amount || amount <= 0) return;
    const updated = goals.map((g) => (g.id === id ? { ...g, current: Number(g.current) + amount } : g));
    setGoals(updated); persist('goals', updated);
    setContribDrafts((prev) => ({ ...prev, [id]: '' })); showToast('Contribuição adicionada');
  };

  const handleResetData = () => {
    if (!resetArmed) { setResetArmed(true); setTimeout(() => setResetArmed(false), 4000); return; }
    setEntries([]); setGoals([]); setIncome(defaultIncome); setBudgetRule(defaultBudgetRule); setCards([]); setCashMovements([]);
    persist('entries', []); persist('goals', []); persist('income', defaultIncome); persist('budgetRule', defaultBudgetRule); persist('cards', []); persist('cashMovements', []);
    setResetArmed(false); showToast('Dados redefinidos');
  };

  // ---- Backup local (JSON e CSV) ----
  const downloadFile = (filename, content, mime) => {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };
  const handleExportJSON = () => {
    downloadFile('painel-financeiro-backup.json', JSON.stringify({ income, entries, goals, budgetRule, cards, cashMovements }, null, 2), 'application/json');
    showToast('Backup .json baixado');
  };
  const handleExportCSV = () => {

  const handleImportJSON = (file) => {
    const reader = new FileReader();

        if (data.income) { setIncome(data.income); persist('income', data.income); }
        if (data.entries) { setEntries(data.entries); persist('entries', data.entries); }
        if (data.goals) { setGoals(data.goals); persist('goals', data.goals); }
        if (data.budgetRule) { setBudgetRule(data.budgetRule); persist('budgetRule', data.budgetRule); }
        if (data.cards) { setCards(data.cards); persist('cards', data.cards); }
        if (data.cashMovements) { setCashMovements(data.cashMovements); persist('cashMovements', data.cashMovements); }
        showToast('Backup importado com sucesso');
      } catch (e) { showToast('Arquivo inválido'); }
    };
    reader.readAsText(file);
  };

service cloud.firestore {

      allow read: if request.auth != null && (resource.data.ownerUid == request.auth.uid || request.auth.uid in resource.data.members);

  }
}`}</pre>

                  <FieldLabel>Cartão</FieldLabel>
                  {cards.length === 0 ? (
                    <p className="text-xs" style={{ color: C.alert }}>Cadastre um cartão na aba "Cartões" primeiro.</p>
                  ) : (
                    <Select value={entryForm.cardId} onChange={(e) => setEntryForm({ ...entryForm, cardId: e.target.value })}>
                      <option value="">Selecione…</option>
                      {cards.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </Select>
                  )}
                </div>
                <div><FieldLabel>Parcelas</FieldLabel>
                  <Select value={entryForm.installments} onChange={(e) => setEntryForm({ ...entryForm, installments: Number(e.target.value) })}>
                    {Array.from({ length: 24 }, (_, i) => i + 1).map((n) => <option key={n} value={n}>{n}x{n > 1 && entryForm.amount ? ` de ${formatBRL(parseFloat(entryForm.amount) / n)}` : ''}</option>)}
                  </Select>
                </div>
              </div>
            )}

            <div className="grid grid-cols-2 gap-4 mt-4"><div><FieldLabel>Recorrência</FieldLabel><Select value={entryForm.recurrence} onChange={(e) => setEntryForm({ ...entryForm, recurrence: e.target.value })}>{RECURRENCES.map((recurrence) => <option key={recurrence} value={recurrence}>{recurrence}</option>)}</Select></div><div><FieldLabel>Tipo</FieldLabel><Select value={entryForm.budgetType} onChange={(e) => setEntryForm({ ...entryForm, budgetType: e.target.value })}>{BUDGET_TYPES.map((bt) => <option key={bt.id} value={bt.id}>{bt.label}</option>)}</Select></div></div>

            {entryForm.recurrence === 'Mensal' && <p className="text-xs mt-2" style={{ color: C.inkMuted }}>Este gasto será criado para o mês escolhido e os 11 meses seguintes.</p>}

            {entryError && <p className="text-sm mt-3" style={{ color: C.alert }}>{entryError}</p>}
            <div className="mt-5"><PrimaryButton onClick={handleAddEntry}>Salvar gasto</PrimaryButton></div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FinanceDashboard />);
</script>
</body>
</html>
